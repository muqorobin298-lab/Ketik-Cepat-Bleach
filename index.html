<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ketik Cepat Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html { overflow-x: hidden; background: #3b1d5e; }
    :root { --accent: #38d4ff; --spark: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      /* cadangan: kalau JS gagal, tetap ada latar, bukan hitam */
      background: #2a8fc7;
      background: linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%) fixed;
      color: #f5f5f5;
      min-height: 100vh; display: block;
      padding: 30px 16px; overflow-x: hidden;
    }
    #scene { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
    .layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s ease; }
    .layer.aktif { opacity: 1; }
    .kanji {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 45vw; font-weight: 900; color: #fff; opacity: 0.06; white-space: nowrap;
    }
    .orb { position: absolute; top: 9%; right: 10%; width: 22vw; height: 22vw; max-width: 260px; max-height: 260px; min-width: 120px; min-height: 120px; border-radius: 50%; }
    .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 36vh; }
    #sparks { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -10px; border-radius: 50%;
      background: var(--spark); box-shadow: 0 0 8px var(--spark);
      opacity: 0; animation: naik linear infinite;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    .box {
      position: relative; z-index: 1;
      background: rgba(8,8,18,0.88);
      border-left: 8px solid var(--accent);
      width: 100%; max-width: 520px; margin: 0 auto; padding: 26px 22px;
      transition: border-color 1s;
    }
    h1 { font-family: 'Anton', Impact, sans-serif; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; }
    h1 span { color: var(--accent); transition: color 1s; }
    .lokasi {
      font-family: 'Anton', Impact, sans-serif; letter-spacing: 3px; font-size: 13px;
      color: var(--accent); margin: 2px 0 14px; text-transform: uppercase; transition: color 1s;
    }
    .info { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; }
    .bar { height: 10px; background: rgba(255,255,255,0.15); margin-bottom: 16px; }
    .bar i { display: block; height: 100%; width: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width 0.25s linear, background 1s; }

    .kata { min-height: 120px; margin-bottom: 14px; }
    .sekarang {
      font-family: 'Anton', Impact, sans-serif; font-size: clamp(34px, 9vw, 52px); letter-spacing: 3px;
      text-transform: uppercase; word-break: break-all; line-height: 1.15; margin-bottom: 10px;
    }
    .sekarang .ok { color: #3ddc84; }
    .sekarang .salah { color: #ff5c5c; text-decoration: underline; }
    .sekarang .sisa { color: #f5f5f5; }
    .berikut { font-size: 15px; opacity: 0.6; letter-spacing: 2px; text-transform: uppercase; line-height: 1.6; }

    input {
      width: 100%; font-family: 'Anton', Impact, sans-serif; font-size: 24px; letter-spacing: 2px; text-transform: uppercase;
      padding: 12px; text-align: center;
      background: rgba(255,255,255,0.08); border: 2px solid #f5f5f5; color: #fff; outline: none;
    }
    input:focus { border-color: var(--accent); }
    input.salah { border-color: #ff5c5c; }
    .petunjuk { font-size: 12px; letter-spacing: 1px; opacity: 0.7; margin: 8px 0 14px; }

    .hasil { text-align: center; }
    .hasil .besar { font-family: 'Anton', Impact, sans-serif; font-size: 88px; line-height: 1; color: var(--accent); transition: color 1s; }
    .hasil .label { font-size: 12px; letter-spacing: 3px; opacity: 0.7; margin-bottom: 14px; }
    .hasil .baris { display: flex; justify-content: center; gap: 28px; font-size: 15px; margin-bottom: 14px; }
    .pangkat { font-size: 17px; margin: 10px 0 18px; line-height: 1.5; }
    .btn {
      font-family: 'Anton', Impact, sans-serif; font-size: 18px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--accent); color: #000; border: none; padding: 12px 28px; cursor: pointer; transition: background 1s;
    }
    .btn:hover { background: #fff; }
    .rekor { font-size: 12px; letter-spacing: 2px; opacity: 0.75; margin-top: 14px; text-align: center; }
    .hidden { display: none; }

    #bankai {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-family: 'Anton', Impact, sans-serif;
      font-size: 16vw; letter-spacing: 6px; color: #ffd400;
      text-shadow: 0 0 30px #ff3d00, 0 0 70px #ff3d00;
      z-index: 5; opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #bankai.muncul { animation: bankai 2.2s ease forwards; }
    @keyframes bankai {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }

    /* ===== TOMBOL KEMBALI KE MENU AWAL (PORTOFOLIO ROBIN) ===== */
    .menu-robin {
      position: fixed; left: 14px; bottom: 14px; z-index: 50;
      font-family: 'Anton', Impact, sans-serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none; color: #f5f5f5;
      background: rgba(8,8,18,0.85); border: 2px solid #f5f5f5;
      padding: 8px 14px; transition: all 0.2s;
    }
    .menu-robin:hover { background: #f5f5f5; color: #000; transform: translateY(-2px); }
    body { padding-bottom: 64px !important; }
  </style>
</head>
<body>
  <a class="menu-robin" href="https://muqorobin298-lab.github.io/Robin_Dev/">← Menu Awal</a>

  <div id="scene"></div>
  <div id="sparks"></div>
  <div id="bankai">BANKAI!</div>

  <div class="box">
    <h1>Ketik <span>Cepat</span></h1>
    <p class="lokasi" id="lokasi"></p>

    <div id="main">
      <div class="info"><span id="sisaWaktu">30 DETIK</span><span id="benarInfo">BENAR 0</span></div>
      <div class="bar"><i id="bar"></i></div>

      <div class="kata">
        <div class="sekarang" id="sekarang"></div>
        <div class="berikut" id="berikut"></div>
      </div>

      <input id="input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Ketik di sini...">
      <p class="petunjuk" id="petunjuk">Waktu mulai saat kamu mengetik huruf pertama. Tekan Spasi atau Enter untuk kata berikutnya.</p>
    </div>

    <div id="hasil" class="hasil hidden">
      <div class="besar" id="wpm"></div>
      <div class="label">KATA PER MENIT</div>
      <div class="baris"><span id="akurasi"></span><span id="benarAkhir"></span></div>
      <p class="pangkat" id="pangkat"></p>
      <button class="btn" id="ulang">Main Lagi</button>
    </div>
    <p class="rekor" id="rekor"></p>
  </div>

  <script>
    const tema = {
      es:     { nama: "Istana Es", kanji: "氷", g: "linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%)", orb: "radial-gradient(circle,#ffffff 0%,#e0f7ff 70%,#9fe3ff 100%)", glow: "#aeeaff", city: "#04182e", accent: "#38d4ff", spark: "#ffffff" },
      malam:  { nama: "Malam Bersalju", kanji: "月", g: "linear-gradient(to top,#2a4a7a,#10234a 50%,#030818 100%)", orb: "radial-gradient(circle,#ffffff 0%,#dbeafe 70%,#a5c8ff 100%)", glow: "#bcd8ff", city: "#050b1a", accent: "#4da6ff", spark: "#d6e8ff" },
      sakura: { nama: "Hujan Sakura", kanji: "桜", g: "linear-gradient(to top,#ff9ec4,#a8326b 45%,#2a0b2e 100%)", orb: "radial-gradient(circle,#fff0f6 0%,#ffc2da 70%,#ff8fba 100%)", glow: "#ffb3d1", city: "#1f0720", accent: "#ff5c9e", spark: "#ffd0e3" },
      senja:  { nama: "Senja Karakura", kanji: "代行", g: "linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%)", orb: "radial-gradient(circle,#fff3c4 0%,#ffd27a 60%,#ff9a3c 100%)", glow: "#ffb347", city: "#1a0a12", accent: "#ff6a00", spark: "#ffcf8a" },
      bankai: { nama: "BANKAI!", kanji: "卍解", g: "linear-gradient(to top,#ff7b3d,#7a0b1b 45%,#2b0008 100%)", orb: "radial-gradient(circle,#fffbe0 0%,#ffe9b0 60%,#ffd400 100%)", glow: "#ffd400", city: "#1a0004", accent: "#ffd400", spark: "#ffe28a" }
    };
    const urutan = Object.keys(tema);

    const kota = `<svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="CITYCOLOR">
      <rect x="0" y="270" width="1200" height="30"/>
      <path d="M90 270 V190 H130 V270 Z"/><path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/><path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/><path d="M95 150 L110 125 L125 150 Z"/>
      <path d="M200 270 V215 H420 V270 Z"/><path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <path d="M520 270 V160 H580 V270 Z"/><path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/><path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/><path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/><path d="M540 82 L550 50 L560 82 Z"/>
      <path d="M680 270 V220 H860 V270 Z"/><path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <path d="M930 270 V185 H980 V270 Z"/><path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/><path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/><path d="M938 140 L955 112 L972 140 Z"/>
      <path d="M1060 270 V225 H1200 V270 Z"/><path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>`;

    const scene = document.getElementById("scene");
    const layers = {};
    urutan.forEach(k => {
      const t = tema[k];
      const d = document.createElement("div");
      d.className = "layer";
      d.style.background = t.g;
      d.innerHTML =
        '<div class="kanji">' + t.kanji + '</div>' +
        '<div class="orb" style="background:' + t.orb + ';box-shadow:0 0 40px ' + t.glow + ',0 0 110px ' + t.glow + '"></div>' +
        kota.replace("CITYCOLOR", t.city);
      scene.appendChild(d);
      layers[k] = d;
    });

    const sparks = document.getElementById("sparks");
    for (let n = 0; n < 35; n++) {
      const s = document.createElement("div");
      s.className = "spark";
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 10) + "s";
      sparks.appendChild(s);
    }

    let aktif = "";
    function gantiTema(k) {
      if (k === aktif) return;
      aktif = k;
      const t = tema[k];
      urutan.forEach(n => layers[n].classList.toggle("aktif", n === k));
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--spark", t.spark);
      document.getElementById("lokasi").textContent = "// " + t.nama;
    }

    // ===== LOGIKA GAME =====
    const $ = id => document.getElementById(id);
    const DURASI = 30;
    const daftarKata = [
      "bankai", "shikai", "zanpakuto", "shinigami", "reiatsu", "hollow", "arrancar", "seireitei",
      "karakura", "kido", "hado", "bakudo", "shunpo", "hirenkyaku", "quincy", "reishi",
      "gotei", "kapten", "letnan", "pedang", "tebasan", "jiwa", "dunia", "roh",
      "cahaya", "bayangan", "badai", "salju", "sakura", "bulan", "senja", "api",
      "es", "petir", "angin", "tombak", "tameng", "gerbang", "menara", "pasukan",
      "semangat", "latihan", "tekad", "kuat", "cepat", "tajam", "berani", "tenang"
    ];

    let antrean = [], idx = 0;
    let benar = 0, salah = 0, hurufBenar = 0, hurufTotal = 0;
    let sisa = DURASI, timer = null, mulaiMain = false, selesai = false;
    let rekor = null;
    try { rekor = JSON.parse(localStorage.getItem("ketikBleachRekor")); } catch (e) { rekor = null; }

    function acak(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function temaProgres() {
      if (benar >= 20) return "bankai";
      if (benar >= 15) return "senja";
      if (benar >= 10) return "sakura";
      if (benar >= 5) return "malam";
      return "es";
    }

    function tampilRekor() {
      $("rekor").textContent = rekor ? "REKOR: " + rekor + " KATA PER MENIT" : "";
    }

    function tampilKata() {
      const k = antrean[idx];
      const ketik = $("input").value.toLowerCase();
      let html = "";
      for (let i = 0; i < k.length; i++) {
        if (i < ketik.length) html += '<span class="' + (ketik[i] === k[i] ? "ok" : "salah") + '">' + k[i] + "</span>";
        else html += '<span class="sisa">' + k[i] + "</span>";
      }
      $("sekarang").innerHTML = html;
      $("berikut").textContent = antrean.slice(idx + 1, idx + 5).join("  ·  ");
      $("input").classList.toggle("salah", ketik.length > 0 && !k.startsWith(ketik));
    }

    function mulai() {
      clearInterval(timer);
      antrean = acak(daftarKata).concat(acak(daftarKata));
      idx = 0; benar = 0; salah = 0; hurufBenar = 0; hurufTotal = 0;
      sisa = DURASI; mulaiMain = false; selesai = false;
      $("main").classList.remove("hidden");
      $("hasil").classList.add("hidden");
      $("input").value = ""; $("input").disabled = false;
      $("sisaWaktu").textContent = DURASI + " DETIK";
      $("benarInfo").textContent = "BENAR 0";
      $("bar").style.width = "100%";
      aktif = ""; gantiTema("es");
      tampilKata(); tampilRekor();
      $("input").focus();
    }

    function mulaiTimer() {
      mulaiMain = true;
      const akhir = Date.now() + DURASI * 1000;
      timer = setInterval(() => {
        const ms = Math.max(0, akhir - Date.now());
        sisa = Math.ceil(ms / 1000);
        $("sisaWaktu").textContent = sisa + " DETIK";
        $("bar").style.width = (ms / (DURASI * 1000) * 100) + "%";
        if (ms <= 0) akhiri();
      }, 100);
    }

    function kirimKata() {
      const ketik = $("input").value.trim().toLowerCase();
      if (!ketik) return;
      const k = antrean[idx];
      hurufTotal += k.length;
      if (ketik === k) { benar++; hurufBenar += k.length; }
      else { salah++; }
      $("benarInfo").textContent = "BENAR " + benar;
      idx++;
      $("input").value = "";
      gantiTema(temaProgres());
      tampilKata();
    }

    function akhiri() {
      if (selesai) return;
      selesai = true;
      clearInterval(timer);
      $("input").disabled = true;
      $("main").classList.add("hidden");
      $("hasil").classList.remove("hidden");

      const wpm = Math.round(benar / (DURASI / 60));
      const total = benar + salah;
      const akurasi = total ? Math.round(benar / total * 100) : 0;
      $("wpm").textContent = wpm;
      $("akurasi").textContent = "AKURASI " + akurasi + "%";
      $("benarAkhir").textContent = "BENAR " + benar + " / " + total;

      let p;
      if (wpm >= 40) p = "Level Kapten Jenderal! Jarimu secepat shunpo.";
      else if (wpm >= 30) p = "Level Kapten! Kecepatan yang mantap.";
      else if (wpm >= 20) p = "Level Letnan. Sedikit latihan lagi.";
      else p = "Level Murid Akademi. Semangat, terus berlatih!";
      $("pangkat").textContent = p;

      if (wpm >= 40) gantiTema("bankai");
      if (wpm >= 40 || benar >= 20) {
        const b = $("bankai");
        b.classList.remove("muncul"); void b.offsetWidth; b.classList.add("muncul");
      }
      if (rekor === null || wpm > rekor) {
        rekor = wpm;
        try { localStorage.setItem("ketikBleachRekor", JSON.stringify(rekor)); } catch (e) {}
        if (wpm > 0) $("pangkat").textContent += " Rekor baru!";
      }
      tampilRekor();
    }

    $("input").addEventListener("input", () => {
      if (selesai) return;
      const v = $("input").value;
      if (!mulaiMain && v.length > 0) mulaiTimer();
      if (v.endsWith(" ")) { kirimKata(); return; }
      tampilKata();
    });
    $("input").addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); if (!selesai) kirimKata(); }
    });
    $("ulang").onclick = mulai;

    mulai();
  </script>
</body>
</html>
